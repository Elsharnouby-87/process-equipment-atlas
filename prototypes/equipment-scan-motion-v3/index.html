<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fired Heater Atlas — Motion Study 02</title>
<style>
:root{--bg:#03131d;--panel:#071f2d;--line:#1c5d76;--cyan:#74ddff;--muted:#789aaa;--text:#e9f7fc;--orange:#ff8b3d;--activeY:82%;--activeH:15%}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 34%,rgba(31,116,153,.12),transparent 36%),linear-gradient(180deg,#041823,#021019)}
.top{padding:calc(12px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.kicker{font:800 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:var(--cyan)}.sub{margin-top:5px;font-size:11px;color:#688b9a}.controls{display:flex;gap:7px}.controls button,.nav button{border:1px solid rgba(116,221,255,.22);background:rgba(7,31,45,.78);color:#bfe8f4;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:700}.controls button:active,.nav button:active{transform:scale(.97)}
.stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 112px;align-items:center;padding:0 12px 0 18px;overflow:hidden}.equipment-wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;perspective:950px}.equipment{position:relative;width:min(58vw,270px);height:min(66vh,560px);transform:rotateX(2deg) rotateY(-4deg);transform-style:preserve-3d;filter:drop-shadow(0 24px 50px rgba(0,0,0,.35));transition:transform .55s cubic-bezier(.2,.8,.2,1)}.equipment::before{content:"";position:absolute;inset:-4% -18%;border-radius:40%;background:radial-gradient(ellipse at center,rgba(76,199,241,.09),transparent 68%);transform:translateZ(-80px);pointer-events:none}
.zone{position:absolute;left:15%;right:15%;border:1px solid rgba(83,179,217,.18);background:linear-gradient(180deg,rgba(12,51,68,.28),rgba(5,25,36,.14));transition:.55s cubic-bezier(.2,.8,.2,1);overflow:hidden}.zone::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(116,221,255,.08),transparent);transform:translateX(-130%)}.zone.active{border-color:rgba(116,221,255,.58);background:linear-gradient(180deg,rgba(18,79,103,.46),rgba(7,30,42,.24));box-shadow:0 0 40px rgba(46,170,215,.12),inset 0 0 25px rgba(67,196,235,.07);transform:translateZ(34px) scale(1.025)}.zone.active::after{animation:sweep 1.8s ease-in-out infinite}.zone.dim{opacity:.42;filter:saturate(.65)}
.stack{top:0;height:16%;left:38%;right:38%;border-radius:12px 12px 4px 4px}.breech{top:15%;height:13%;left:25%;right:25%;border-radius:5px}.conv{top:27%;height:22%;border-radius:6px}.rad{top:48%;height:36%;border-radius:6px}.burn{top:83%;height:17%;left:20%;right:20%;border-radius:5px 5px 14px 14px}
.tubes{position:absolute;inset:10% 10%;display:flex;justify-content:space-between;gap:6px}.tubes i{display:block;width:7%;border-radius:20px;background:linear-gradient(90deg,#193f50,#6a9aaa,#1c4353);opacity:.78}.conv-lines{position:absolute;inset:14% 8%;display:grid;gap:7px}.conv-lines i{height:6px;border-radius:20px;background:linear-gradient(90deg,#173f4e,#76a7b5,#173f4e);opacity:.72}.burners{position:absolute;inset:18% 9%;display:flex;align-items:end;justify-content:space-around}.burners i{width:14px;height:34px;border:2px solid #486f7d;border-bottom:0;border-radius:12px 12px 0 0;position:relative}.burners i::after{content:"";position:absolute;left:50%;bottom:17px;width:22px;height:40px;transform:translateX(-50%);background:radial-gradient(ellipse at bottom,rgba(255,139,61,.95),rgba(255,139,61,.25) 45%,transparent 70%);filter:blur(1px);opacity:.75;animation:flame 2.6s ease-in-out infinite alternate}.damper{position:absolute;left:16%;right:16%;top:44%;height:3px;background:#5d8493;transform:rotate(-10deg)}
.scanner{position:absolute;left:7%;right:7%;top:var(--activeY);height:var(--activeH);border-top:1px solid rgba(116,221,255,.7);border-bottom:1px solid rgba(116,221,255,.42);background:linear-gradient(180deg,rgba(116,221,255,.03),rgba(116,221,255,.1),rgba(116,221,255,.03));box-shadow:0 0 38px rgba(83,207,247,.2);pointer-events:none;transition:top .7s cubic-bezier(.17,.84,.22,1),height .7s cubic-bezier(.17,.84,.22,1)}.scanner::before{content:"";position:absolute;left:-5%;right:-5%;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 16px var(--cyan);animation:pulse 1.35s ease-in-out infinite}
.rail{align-self:center;display:flex;flex-direction:column;gap:9px;padding-right:4px}.rail button{position:relative;text-align:left;padding:10px 8px 10px 14px;border:0;background:transparent;color:#547a8b;font-size:9px;font-weight:800;letter-spacing:.04em}.rail button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:#1d4c5f;border-radius:2px;transition:.35s}.rail button.active{color:#dff8ff}.rail button.active::before{background:var(--cyan);box-shadow:0 0 10px rgba(116,221,255,.7)}.rail span{display:block;margin-top:3px;color:#395f70;font:700 7px/1.2 ui-monospace,monospace}.rail button.active span{color:#6ea8ba}
.bottom{padding:8px 14px calc(12px + env(safe-area-inset-bottom));}.info{border:1px solid rgba(92,190,229,.2);background:linear-gradient(145deg,rgba(7,31,45,.9),rgba(3,18,28,.96));border-radius:16px;padding:14px 15px 12px;box-shadow:0 18px 45px rgba(0,0,0,.18)}.eyebrow{font:800 8px/1 ui-monospace,monospace;letter-spacing:.16em;color:#69cce9}.title-row{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:7px}.title{font-size:24px;font-weight:850;letter-spacing:-.03em}.num{font:800 12px/1 ui-monospace,monospace;color:#4f8093}.purpose{margin-top:7px;color:#8ca9b5;font-size:11px;line-height:1.45;min-height:32px}.path{margin-top:9px;padding-top:9px;border-top:1px solid rgba(98,190,226,.12);font:750 9px/1.45 ui-monospace,monospace;color:#8ab6c5}.nav{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{padding:10px}.hint{text-align:center;margin-top:7px;font:700 7px/1 ui-monospace,monospace;letter-spacing:.12em;color:#476d7b}
.paused .scanner::before,.paused .zone.active::after,.paused .burners i::after{animation-play-state:paused}.paused .equipment{transform:none}
@keyframes sweep{0%,35%{transform:translateX(-130%)}70%,100%{transform:translateX(130%)}}@keyframes pulse{0%,100%{opacity:.35;transform:scaleX(.82)}50%{opacity:1;transform:scaleX(1)}}@keyframes flame{from{transform:translateX(-50%) scale(.92,.9);opacity:.62}to{transform:translateX(-50%) scale(1.08,1.05);opacity:.88}}
@media(min-width:780px){.shell{grid-template-rows:auto 1fr}.stage{grid-template-columns:minmax(0,1fr) 180px 380px;padding:12px 40px 30px}.bottom{position:absolute;right:34px;top:105px;width:360px;padding:0}.equipment{width:320px;height:620px}.rail{margin-right:390px}.top{padding:24px 34px}.hint{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.scanner,.zone,.equipment{transition:none}.scanner::before,.zone::after,.burners i::after{animation:none}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="top">
    <div><div class="kicker">MOTION STUDY 02 · EQUIPMENT SCAN</div><div class="sub">Physical location first — the heater itself becomes the navigator.</div></div>
    <div class="controls"><button id="pause">Pause</button><button id="reset">Reset</button></div>
  </header>

  <main class="stage" id="stage">
    <div class="equipment-wrap">
      <div class="equipment" id="equipment" aria-label="Stylized fired heater hierarchy">
        <div class="zone stack" data-zone="3"></div>
        <div class="zone breech" data-zone="3"><div class="damper"></div></div>
        <div class="zone conv" data-zone="2"><div class="conv-lines"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="zone rad" data-zone="1"><div class="tubes"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="zone burn" data-zone="0"><div class="burners"><i></i><i></i><i></i></div></div>
        <div class="scanner" id="scanner"></div>
      </div>
    </div>

    <nav class="rail" id="rail" aria-label="Heater systems">
      <button data-index="3">04 STACK<span>flue gas exit</span></button>
      <button data-index="2">03 CONVECTION<span>heat recovery</span></button>
      <button data-index="1">02 RADIANT<span>process heating</span></button>
      <button data-index="0">01 BURNER<span>combustion root</span></button>
    </nav>
  </main>

  <footer class="bottom">
    <section class="info" aria-live="polite">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title-row"><div class="title" id="title"></div><div class="num" id="num"></div></div>
      <div class="purpose" id="purpose"></div>
      <div class="path" id="path"></div>
      <div class="nav"><button id="down">↓ LOWER ZONE</button><button id="up">↑ UPPER ZONE</button></div>
      <div class="hint">SWIPE VERTICALLY ON THE EQUIPMENT</div>
    </section>
  </footer>
</div>
<script>
const modules=[
 {eyebrow:'COMBUSTION SYSTEM',title:'Burner Assembly',purpose:'Where fuel and combustion air meet, ignite and establish the flame root.',path:'Fuel + air → burner → flame root → radiant section',y:'83%',h:'17%'},
 {eyebrow:'RADIANT SECTION',title:'Radiant Tubes',purpose:'The main firebox heat-transfer zone where flame radiation reaches the process tubes.',path:'Firebox → tube surface → tube wall → process fluid',y:'48%',h:'36%'},
 {eyebrow:'UPPER HEAT RECOVERY',title:'Shield + Convection',purpose:'Recover useful heat from hot flue gas after it leaves the radiant firebox.',path:'Radiant outlet → shield → convection → breeching',y:'27%',h:'22%'},
 {eyebrow:'DRAFT & FLUE-GAS SYSTEM',title:'Breeching + Stack',purpose:'Guide flue gas through the damper and stack while maintaining the draft path.',path:'Convection outlet → breeching → damper → stack',y:'0%',h:'28%'}
];
let active=0,paused=false,touchY=null,wheelLock=false;
const root=document.documentElement,shell=document.getElementById('shell');
const title=document.getElementById('title'),eyebrow=document.getElementById('eyebrow'),purpose=document.getElementById('purpose'),path=document.getElementById('path'),num=document.getElementById('num');
const zones=[...document.querySelectorAll('.zone')],rail=[...document.querySelectorAll('.rail button')];
function render(i){active=Math.max(0,Math.min(3,i));const m=modules[active];root.style.setProperty('--activeY',m.y);root.style.setProperty('--activeH',m.h);eyebrow.textContent=m.eyebrow;title.textContent=m.title;purpose.textContent=m.purpose;path.textContent=m.path;num.textContent='0'+(active+1);zones.forEach(z=>{const n=+z.dataset.zone;z.classList.toggle('active',n===active);z.classList.toggle('dim',n!==active)});rail.forEach(b=>b.classList.toggle('active',+b.dataset.index===active));document.getElementById('down').disabled=active===0;document.getElementById('up').disabled=active===3}
function step(dir){render(active+dir)}
rail.forEach(b=>b.addEventListener('click',()=>render(+b.dataset.index)));
document.getElementById('up').onclick=()=>step(1);document.getElementById('down').onclick=()=>step(-1);
document.getElementById('reset').onclick=()=>render(0);
document.getElementById('pause').onclick=()=>{paused=!paused;shell.classList.toggle('paused',paused);document.getElementById('pause').textContent=paused?'Resume':'Pause'};
document.getElementById('stage').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{if(touchY===null)return;const d=touchY-e.changedTouches[0].clientY;if(Math.abs(d)>42)step(d>0?1:-1);touchY=null},{passive:true});
window.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<12)return;wheelLock=true;step(e.deltaY>0?1:-1);setTimeout(()=>wheelLock=false,520)},{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='ArrowUp')step(1);if(e.key==='ArrowDown')step(-1)});
render(0);
</script>
</body>
</html>
