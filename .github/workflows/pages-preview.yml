name: GitHub Pages Development Preview

on:
  push:
    branches:
      - floot-migration-dev
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble Heater3D source
        run: |
          cat src/_migration/Heater3D.part0.txt src/_migration/Heater3D.part1.txt src/_migration/Heater3D.part2.txt src/_migration/Heater3D.part3.txt src/_migration/Heater3D.part4.txt > src/Heater3D.tsx
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/Heater3D.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const before = "group.traverse(obj => { obj.visible = true; });";
          const after = "group.traverse(obj => { if (obj !== breechingFullShell && obj !== breechingCutShell && obj !== stackFullShell && obj !== stackCutShell && obj !== pilotMicroRef.current) obj.visible = true; });";
          if (!source.includes(before)) throw new Error('Expected v42 visibility reset not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build GitHub source
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
