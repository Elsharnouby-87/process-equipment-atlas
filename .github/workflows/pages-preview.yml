name: GitHub Pages Development Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development source
        uses: actions/checkout@v4
        with:
          ref: floot-migration-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble Heater3D source
        run: |
          cat src/_migration/Heater3D.part0.txt src/_migration/Heater3D.part1.txt src/_migration/Heater3D.part2.txt src/_migration/Heater3D.part3.txt src/_migration/Heater3D.part4.txt > src/Heater3D.tsx
          node scripts/assemble-preview.mjs
          node scripts/assemble-burner-sim.mjs
          node scripts/free-explore-patch.mjs
          node scripts/burner-camera-geometry-refinement.mjs
          node scripts/fuel-visibility-clearance-refinement.mjs
          node scripts/restore-burner-exploded.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build GitHub source
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

