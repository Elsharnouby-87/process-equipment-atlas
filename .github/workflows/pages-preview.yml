name: GitHub Pages Development Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development source
        uses: actions/checkout@v4
        with:
          ref: checkpoint-pre-components-motion-prototype-2026-09-14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency sanity
        run: npm ls react react-dom three

      - name: Assemble project source
        run: node scripts/assemble-project.mjs

      - name: Structural regression QA
        run: node scripts/qa-structure.mjs

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Navigation architecture QA
        run: node scripts/qa-navigation-architecture.mjs

      - name: Operation state machine QA
        run: node scripts/qa-operation-state-v1.mjs

      - name: Physics V2 regression QA
        run: node scripts/qa-physics-v2.mjs

      - name: Production build QA
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# preview target only: checkpoint-pre-components-motion-prototype-2026-09-14
